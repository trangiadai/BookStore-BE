spring:
  application:
    name: BookStore_Web_Application 
  datasource:
    url: jdbc:mysql://localhost:3306/book_store_db?useSSL=false&serverTimezone=UTC
    username: root
    password: 1234

server:
  port: 3636
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mappers/*.xml
logging:
  level:
    org:
      mybatis: debug



